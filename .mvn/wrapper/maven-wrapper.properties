# Maven Wrapper configuration. Read by ./mvnw and mvnw.cmd on every run.
#
# This pins the exact Maven version the project builds with. Anyone who clones
# the repo — and CI — gets this version downloaded to ~/.m2/wrapper on first
# run. No global Maven install is needed or used. Change the version here,
# commit, and every machine follows.
#
# only-script: the two launcher scripts download Maven themselves; there is no
# wrapper jar to keep in the repo.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
